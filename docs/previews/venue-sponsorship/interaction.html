    single("[data-clock]").textContent = "1年"+date(state.day)+(state.day === 0 ? " 17:30" : " 21:00");
    single("[data-wallet]").textContent = cash(state.wallet);
    single("[data-unread]").textContent = state.unread;
    single('[data-field="venue"]').value = state.venue;
    root.querySelectorAll("[data-context]").forEach(b => b.setAttribute("aria-pressed",b.dataset.context === state.context));
    const advance = single('[data-act="advance"]');
    const upcoming = Object.values(state.records).filter(record => !record.done);
    advance.parentElement.hidden = advance.hidden = !upcoming.length;
    advance.textContent = upcoming.length ? "演示 · 跳到"+date(Math.min(...upcoming.map(record => record.day)))+"活动后" : "";
    const layer = single("[data-layer]");
    const shade = '<div class="ov-dim" aria-hidden="true"></div>';
    const venueShade = state.venue === "bar" ? "" : shade;
    switch (state.panel) {
      case "venue": layer.innerHTML = venueShade + venueView(v); break;
      case "talk": layer.innerHTML = shade + talkView(v); break;
      case "events": layer.innerHTML = venueShade + venueEvents(v); break;
      case "sponsor-status": layer.innerHTML = venueShade + sponsorStatus(v); break;
      case "offer": layer.innerHTML = venueShade + offerView(v); updateOffer(); break;
      case "schedule": case "notice": layer.innerHTML = shade + calendarView(state.panel === "notice"); break;
      case "record": layer.innerHTML = shade + recordView(); break;
      case "shop": layer.innerHTML = shade + shopView(); break;
      case "service": {
        const [name, description, price] = v.services[state.service];
        layer.innerHTML = shade + windowView(name,`<p>${description} · ${price}</p><div class="ov-foot">${button("return-venue","返回场所菜单")}</div>`,"","return-venue");
        break;
      }
      default:
        layer.innerHTML = `<button type="button" class="ov-encounter" data-act="${atVenue() ? "menu" : "talk"}">${atVenue() ? "打开场所菜单" : state.context === "phone" ? "拨打"+v.person+"的电话" : "交谈 · "+v.person+"　F"}</button>`;
    }
  }
  function sceneTo(context) {
    state.context = context;
    state.reply = null;
    state.back = null;
    state.draft = null;
    state.panel = atVenue() ? "venue" : "talk";
  }
  root.addEventListener("change", event => {
    const {field} = event.target.dataset;
    const value = event.target.value;
    if (field === "venue") {
      state.venue = value;
      sceneTo("venue");
    } else if (field === "shop-view") {
      state.activeStore = value;
    } else if (state.panel === "offer" && field === "store" && stores[value]) {
      Object.assign(state.draft,{store:value, product:"", quantity:0, price:0});
    } else if (state.panel === "offer" && field === "product") {
      const {store} = state.draft;
      const picked = maxUnits(store,value)>0 ? value : "";
      Object.assign(state.draft,{product:picked,quantity:Math.min(10,maxUnits(store,picked)),price:picked ? Math.round(stores[store].prices[picked]*.8) : 0});
    } else return;
    render();
    single(`[data-field="${field}"]`)?.focus();
  });
  root.addEventListener("input", event => {
    if (state.panel !== "offer") return;
    const {field} = event.target.dataset;
    if (!["fee","quantity","price"].includes(field)) return;
    state.draft[field] = event.target.valueAsNumber;
    updateOffer();
  });
  function settle(record, key) {
    const estimate = forecast(key,record.fee);
    const {capacity,guests} = budgets[key];
    const desired = Math.min(estimate.attendance[1],estimate.average+1);
    const invited = guests.slice(0, Math.ceil(desired*.4)+1);
    // One invitation fails in the demo. Only the people who arrive affect the guest limit.
    record.namedGuests = invited.slice(0,-1);
    record.attendance = Math.min(desired,maximumAttendance(record.namedGuests.length,capacity));
    Object.assign(record,gains(record.attendance));
    record.sold = 0;
    record.revenue = 0;
    if (record.product) {
      const discount = 1-record.price/stores[record.store].prices[record.product];
      record.sold = Math.min(record.quantity, Math.floor(record.attendance*(.08+.65*discount)));
      record.revenue = Math.round(record.sold*record.price*100)/100;
      inventory[record.store][record.product] += record.quantity-record.sold;
    }
    record.done = true;
  }
  root.addEventListener("click", event => {
    const control = event.target.closest("button");
    if (!control || control.disabled) return;
    if (control.dataset.context) {
      sceneTo(control.dataset.context);
      render();
      return;
    }
    const [action,index] = (control.dataset.act || "").split(":");
    const v = venues[state.venue];
    switch (action) {
      case "talk": state.panel = "talk"; state.reply = null; break;
      case "chat":
        state.familiar[state.venue] = Math.max(state.familiar[state.venue],requiredFamiliarity);
        state.reply = atVenue() ? v.chat : "好久没碰面了。你最近怎么样？";
        break;
      case "prices": state.reply = "最近街坊挑东西，多半会先比一比价。"; break;
      case "people": state.reply = "附近有几位我常碰面的街坊，下次见了可以给你介绍。"; break;
      case "gift": state.reply = "你有这份心就好，先留着吧。"; break;
      case "invite": state.reply = "可以啊，找个我们都有空的时候。"; break;
      case "events": if (atVenue()) state.panel = "events"; break;
      case "menu": if (atVenue()) state.panel = "venue"; break;
      case "sponsor":
        if (atVenue() && ["venue","events","offer","sponsor-status"].includes(state.panel)) {
          if (canOffer()) {
            state.draft ??= emptyDraft(v);
            state.panel = "offer";
          } else {
            state.panel = "sponsor-status";
          }
        }
        break;
      case "end": reopen(); break;
      case "close-venue": state.panel = "world"; state.draft = null; break;
      case "leave": sceneTo("street"); state.panel = "world"; break;
      case "service": if (atVenue()) { state.service = Number(index); state.panel = "service"; } break;
      case "return-venue": reopen(); break;
      case "book": {
        if (state.panel !== "offer" || !canOffer() || offerError()) return;
        const {fee,store,product,quantity,price} = state.draft;
        if (product) inventory[store][product] -= quantity;
        state.wallet -= fee;
        state.records[state.venue] = { done:false, day:nextDay(v), fee, store, product, quantity, price };
        state.draft = null;
        state.panel = "sponsor-status";
        break;
      }
      case "advance": {
        const pending = Object.entries(state.records).filter(([,record]) => !record.done);
        if (!pending.length) return;
        state.day = Math.min(...pending.map(([,record]) => record.day));
        const settling = pending.filter(([,record]) => record.day === state.day);
        settling.forEach(([key,record]) => settle(record,key));
        state.unread += settling.length;
        break;
      }
      case "notice": case "schedule": case "shop":
        if (state.panel === action) { dismiss(); break; }
        if (!["shop","notice","schedule","record"].includes(state.panel)) state.back = state.panel;
        if (action === "shop" && state.panel === "record") state.activeStore = state.records[state.detail].store;
        if (action === "notice") state.unread = 0;
        state.panel = action;
        break;
      case "record":
        if (!state.records[index]) return;
        state.list = state.panel;
        state.detail = index;
        state.panel = "record";
        break;
      case "back-list": state.panel = state.list; break;
      case "close": dismiss(); break;
      default: return;
    }
    render();
    if (["events","sponsor"].includes(action)) single(`[data-act="${action}"]`)?.focus();
  });
  render();
})();
</script>
